# A CoreXY with quad gantry levelling, TMC2209 drivers and sensorless homing.
# Nothing here contradicts anything else, so the check has nothing to say.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 15
max_z_accel: 350

[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	50,25
	50,275
	300,275
	300,25
speed: 100
retry_tolerance: 0.0075

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 300
position_max: 300
homing_speed: 40

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.8
diag_pin: PG6
driver_SGTHRS: 255

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 300
position_max: 300

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.8
diag_pin: PG9
driver_SGTHRS: 255

[extruder]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA2
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
min_temp: 10
max_temp: 300

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 120
