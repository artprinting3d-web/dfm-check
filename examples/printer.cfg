# A CoreXY that contradicts itself three ways, each one a rule in the vendored
# klipper-configurator validator:
#
#   1. CoreXY with no levelling section at all       -> warn_corexy_no_level
#   2. sensorless homing with no [tmc*] section      -> err_sensorless_dumb
#   3. a CAN toolhead board driving a BLTouch        -> warn_can_bltouch
#
# The board class is readable here because [mcu EBBCan] declares a canbus_uuid, which is
# what a CAN toolhead board looks like. Nothing else in this file names a board.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx-if00

[mcu EBBCan]
canbus_uuid: 0e0d81e4210c

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 15
max_z_accel: 350

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: virtual_endstop
position_endstop: 300
position_max: 300

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: virtual_endstop
position_endstop: 300
position_max: 300

[bltouch]
sensor_pin: ^EBBCan: PB8
control_pin: EBBCan: PB9
x_offset: 0
y_offset: 25.0
z_offset: 2.2

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
rotation_distance: 22.6789511
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan: PA3
min_temp: 10
max_temp: 300
